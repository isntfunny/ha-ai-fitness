# The contents of this file is based on https://github.com/home-assistant/core/blob/dev/pyproject.toml

target-version = "py313"

[lint]
select = [
    "ALL",
]

ignore = [
    "ANN401", # Dynamically typed expressions (typing.Any) are disallowed
    "D203", # no-blank-line-before-class (incompatible with formatter)
    "D212", # multi-line-summary-first-line (incompatible with formatter)
    "COM812", # incompatible with formatter
    "ISC001", # incompatible with formatter
]

[lint.flake8-pytest-style]
fixture-parentheses = false

[lint.pyupgrade]
keep-runtime-typing = true

[lint.mccabe]
max-complexity = 25

# Project-specific relaxations.
#
# TC001/TC002: Home Assistant evaluates several of these imports at runtime
#   (generic subscripts like CoordinatorEntity[AiFitnessCoordinator] and
#   ConfigEntry[AiFitnessCoordinator]), so they must stay real imports.
# EM101/EM102/TRY003: the API wrapper raises short, contextual messages inline;
#   splitting each into a variable or an exception subclass adds noise here.
[lint.extend-per-file-ignores]
"custom_components/ai_fitness/*.py" = ["TC001", "TC002", "TC003", "EM101", "EM102", "TRY003"]
